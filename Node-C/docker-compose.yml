services:
  mariadb-node-3:
    image: mariadb:11.4
    container_name: mariadb_node_3
    restart: always
    command: [
      "mariadbd",
      "--wsrep-on=ON",
      "--wsrep-provider=/usr/lib/galera/libgalera_smm.so",
      "--wsrep-cluster-name=my_galera_cluster",
      "--wsrep-cluster-address=gcomm://192.168.1.10:4567,192.168.1.11:4567", # Points to Host 1 & 2
      "--wsrep-node-name=node3",
      "--wsrep-node-address=192.168.1.12" # IP of Host 3
    ]
    ports:
      - "3306:3306"
      - "4567:4567"
      - "4567:4567/udp"
      - "4568:4568"
      - "4444:4444"
    environment:
      MARIADB_ROOT_PASSWORD: "SuperSecureRootPassword" # Must match Node 1
    volumes:
      - mariadb_data_3:/var/lib/mysql

volumes:
  mariadb_data_3:

